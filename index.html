<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blair's Little Doodlebook</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;overflow-x:hidden}body{background:transparent;color:#674737;font:12px Georgia,serif}.doodle{width:100%;max-width:240px;margin:0 auto;padding:10px;background:#f7efe4;border:1px solid #b99b80;border-radius:13px;text-align:center;overflow:hidden}h2{font-size:17px;font-style:italic;font-weight:normal;margin:3px 0 5px}p{margin:0 0 9px;font-size:10px;color:#8c6d5b}.paper{height:205px;width:100%;position:relative;background:repeating-linear-gradient(#fffcf6 0px,#fffcf6 24px,#e9ded0 25px);border:1px solid #c9ad96;border-radius:7px;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.palette{display:flex;justify-content:center;gap:8px;margin:10px 0 8px}.swatch{width:22px;height:22px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #b99b80;cursor:pointer;padding:0}.swatch[aria-pressed=true]{outline:2px solid #674737;outline-offset:2px}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.tools button,.save{border:1px solid #b99b80;border-radius:7px;background:#fffaf3;color:#674737;font:11px Georgia,serif;min-height:30px;cursor:pointer;padding:5px 3px}.tools button.active{background:#e4c7cd}.save{width:100%;margin-top:7px;background:#79513e;color:#fffaf3;border-color:#79513e}label{display:flex;align-items:center;gap:6px;justify-content:center;margin:9px 0 2px;font-size:11px}input[type=range]{width:100px;accent-color:#79513e}.note{font-size:9px;line-height:1.4;margin:8px 0 0;color:#967c6d}
</style></head><body><section class="doodle"><h2>little doodlebook ♡</h2><p>a tiny place to draw something lovely</p><div class="paper"><canvas id="canvas" aria-label="Drawing canvas"></canvas></div><div class="palette" aria-label="Ink colors"><button class="swatch" data-color="#674737" style="background:#674737" aria-label="Chocolate ink" aria-pressed="true"></button><button class="swatch" data-color="#bc8490" style="background:#bc8490" aria-label="Pink ink" aria-pressed="false"></button><button class="swatch" data-color="#a18d6e" style="background:#a18d6e" aria-label="Taupe ink" aria-pressed="false"></button><button class="swatch" data-color="#7c8a78" style="background:#7c8a78" aria-label="Sage ink" aria-pressed="false"></button><button class="swatch" data-color="#3c3838" style="background:#3c3838" aria-label="Charcoal ink" aria-pressed="false"></button></div><label>brush size <input id="brush" type="range" min="1" max="16" value="4"><span id="size">4</span></label><div class="tools"><button id="pen" class="active">Pen</button><button id="eraser">Eraser</button><button id="undo">Undo</button><button id="clear">Clear</button><button id="redo">Redo</button><button id="new">New page</button></div><button class="save" id="save">save my doodle ♡</button><p class="note">your drawing stays on this page only. nothing is uploaded.</p></section><script>
(()=>{'use strict';const c=document.getElementById('canvas'),ctx=c.getContext('2d'),paper=document.querySelector('.paper');const pen=document.getElementById('pen'),eraser=document.getElementById('eraser');let color='#674737',width=4,mode='pen',drawing=false,previous=null,history=[],future=[];function snapshot(){return ctx.getImageData(0,0,c.width,c.height)}function restore(s){ctx.putImageData(s,0,0)}function push(){history.push(snapshot());if(history.length>30)history.shift();future=[]}function setup(){const w=Math.max(1,Math.round(paper.clientWidth)),h=Math.max(1,Math.round(paper.clientHeight));if(c.width===w&&c.height===h)return;let old=document.createElement('canvas');old.width=c.width;old.height=c.height;if(c.width&&c.height)old.getContext('2d').drawImage(c,0,0);c.width=w;c.height=h;if(old.width)ctx.drawImage(old,0,0);history=[];future=[]}setup();if(window.ResizeObserver)new ResizeObserver(setup).observe(paper);function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function stroke(a,b){ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalCompositeOperation='source-over'}c.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();push();drawing=true;previous=point(e);c.setPointerCapture(e.pointerId);stroke(previous,{x:previous.x+.01,y:previous.y+.01})});c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=point(e);stroke(previous,p);previous=p});function stop(){drawing=false;previous=null}c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.color;mode='pen';pen.classList.add('active');eraser.classList.remove('active');document.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed',String(s===b)))}));document.getElementById('brush').addEventListener('input',e=>{width=+e.target.value;document.getElementById('size').textContent=width});pen.onclick=()=>{mode='pen';pen.classList.add('active');eraser.classList.remove('active')};eraser.onclick=()=>{mode='eraser';eraser.classList.add('active');pen.classList.remove('active')};document.getElementById('undo').onclick=()=>{if(history.length){future.push(snapshot());restore(history.pop())}};document.getElementById('redo').onclick=()=>{if(future.length){history.push(snapshot());restore(future.pop())}};function clear(){push();ctx.clearRect(0,0,c.width,c.height)}document.getElementById('clear').onclick=clear;document.getElementById('new').onclick=()=>{if(confirm('Start a fresh doodle?'))clear()};document.getElementById('save').onclick=()=>{const out=document.createElement('canvas');out.width=c.width*2;out.height=c.height*2;const x=out.getContext('2d');x.scale(2,2);x.fillStyle='#fffcf6';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#e9ded0';x.lineWidth=1;for(let y=25;y<c.height;y+=25){x.beginPath();x.moveTo(0,y);x.lineTo(c.width,y);x.stroke()}x.drawImage(c,0,0);const a=document.createElement('a');a.href=out.toDataURL('image/png');a.download='my-little-doodle.png';a.click()};})();
</script></body></html>
